server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 client_max_body_size 21m;
 location /api/ {
   proxy_pass http://api:8080;
   proxy_set_header Host $host;
   proxy_set_header X-Real-IP $remote_addr;
   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
   proxy_set_header X-Forwarded-Proto $scheme;
 }
 location = /index.html { add_header Cache-Control "no-cache"; }
 location = /sw.js { add_header Cache-Control "no-cache"; add_header Service-Worker-Allowed "/"; try_files $uri =404; }
 location = /manifest.webmanifest { default_type application/manifest+json; try_files $uri =404; }
 location /health { proxy_pass http://api:8080; }
 location /swagger { proxy_pass http://api:8080; }
 location / { try_files $uri $uri/ /index.html; }
}

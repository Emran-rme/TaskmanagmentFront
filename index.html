<!doctype html>
<html
  lang="fa"
  dir="rtl"
  class="font-sans [color-scheme:light] dark:[color-scheme:dark]"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#008beb" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/app-icon-192.png" />
    <script>
      try {
        const theme = localStorage.getItem("tm-theme");
        document.documentElement.classList.toggle(
          "dark",
          theme === "dark" ||
            (theme !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches),
        );
      } catch {
        document.documentElement.classList.toggle(
          "dark",
          window.matchMedia("(prefers-color-scheme: dark)").matches,
        );
      }
    </script>
    <link
      rel="preload"
      href="/fonts/iransans/IRANSansWeb.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>پلتفرم جامع همکاری سازمانی</title>
    <link rel="icon" type="image/webp" href="/branding/fanaone-logo.webp" />
  </head>
  <body
    class="bg-slate-50 text-slate-700 dark:bg-slate-950 dark:text-slate-200"
  >
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
